<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor">
  <!-- Maporia History Icon -->
  <!-- Style: Clean, modern, rounded terminals matching brand symbol -->
  <!-- Concept: Stack of cards representing past events/places with time element -->
  
  <!-- Back card (bottom layer, shifted right and down) -->
  <path d="
    M 22 38
    C 22 33, 24 29, 27 26
    C 30 23, 34 21, 39 21
    C 44 21, 48 23, 51 26
    C 54 29, 56 33, 56 38
    L 56 73
    C 56 78, 54 82, 51 85
    C 48 88, 44 90, 39 90
    C 34 90, 30 88, 27 85
    C 24 82, 22 78, 22 73
    Z
  " opacity="0.12"/>
  
  <!-- Middle card (shifted right and down) -->
  <path d="
    M 26 32
    C 26 27, 28 23, 31 20
    C 34 17, 38 15, 43 15
    C 48 15, 52 17, 55 20
    C 58 23, 60 27, 60 32
    L 60 67
    C 60 72, 58 76, 55 79
    C 52 82, 48 84, 43 84
    C 38 84, 34 82, 31 79
    C 28 76, 26 72, 26 67
    Z
  " opacity="0.25"/>
  
  <!-- Front card (main) -->
  <path d="
    M 30 25
    C 30 20, 32 16, 35 13
    C 38 10, 42 8, 47 8
    C 52 8, 56 10, 59 13
    C 62 16, 64 20, 64 25
    L 64 60
    C 64 65, 62 69, 59 72
    C 56 75, 52 77, 47 77
    C 42 77, 38 75, 35 72
    C 32 69, 30 65, 30 60
    Z
  "/>
  
  <!-- Clock symbol on front card (filled style matching brand) -->
  <!-- Clock outer circle -->
  <circle cx="47" cy="42" r="11" fill="currentColor" opacity="0.15"/>
  
  <!-- Clock inner circle (face) -->
  <circle cx="47" cy="42" r="8.5" fill="currentColor" opacity="0.25"/>
  
  <!-- Hour hand (pointing left - past) -->
  <path d="
    M 47 42
    L 42 42
  " stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Minute hand (pointing up-left) -->
  <path d="
    M 47 42
    L 44.5 37
  " stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Clock center dot -->
  <circle cx="47" cy="42" r="2" fill="currentColor"/>
</svg>
